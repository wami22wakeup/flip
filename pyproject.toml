[project]
name = "flip"
version = "0.1.0"
description = "Fuzzer for decision models (Jev, Laya, CLM): finds which small edits flip their decisions."
readme = "README.md"
authors = [
    { name = "Wamika", email = "wami.singh.ka@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# package lives at ./flip, not ./src/flip
module-root = ""
